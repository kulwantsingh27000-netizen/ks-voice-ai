<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KS Voice AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#06142f;
  color:white;
}

header{
  background:#08285c;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.logo span{color:#ffd21c}

nav a{
  color:white;
  text-decoration:none;
  margin-left:12px;
}

.hero{
  padding:45px 20px;
  text-align:center;
  background:linear-gradient(135deg,#073b8f,#07152f);
}

.hero h1{
  font-size:42px;
  margin:10px;
}

.hero h1 span{color:#ffd21c}

.hero p{font-size:18px}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 15px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.card{
  background:white;
  color:#222;
  border-radius:18px;
  padding:25px;
  box-shadow:0 8px 25px #0005;
}

.card h2{
  color:#063b91;
}

textarea,
select,
input{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

button{
  width:100%;
  border:0;
  border-radius:10px;
  padding:14px;
  font-size:16px;
  font-weight:bold;
  background:#075be8;
  color:white;
  cursor:pointer;
}

button:hover{
  background:#043fa5;
}

.result{
  display:none;
  margin-top:20px;
  padding:20px;
  background:#eef5ff;
  border-radius:12px;
}

audio{
  width:100%;
  margin-top:10px;
}

.status{
  margin-top:10px;
  font-weight:bold;
}

footer{
  text-align:center;
  padding:30px;
  color:#bbb;
}

@media(max-width:700px){
  .grid{grid-template-columns:1fr}
  .hero h1{font-size:32px}
  nav{display:none}
}
</style>
</head>

<body>

<header>
  <div class="logo">KS Voice <span>AI</span></div>

  <nav>
    <a href="#clone">Voice Clone</a>
    <a href="#tts">Text to Speech</a>
    <a href="#pricing">Pricing</a>
  </nav>
</header>

<section class="hero">
  <h1>KS Voice <span>AI</span></h1>
  <p>Punjabi • Hindi • English AI Voice</p>
</section>

<div class="container">

<div class="grid">

<!-- VOICE CLONE -->
<div class="card" id="clone">
  <h2>🎙️ Voice Clone</h2>
  <p>ਆਪਣੀ voice recording upload ਕਰੋ।</p>

  <input type="file" id="voiceFile" accept="audio/*">

  <button onclick="cloneDemo()">Create Voice Clone</button>

  <div id="cloneStatus" class="status"></div>
</div>


<!-- TEXT TO SPEECH -->
<div class="card" id="tts">
  <h2>🔊 Text to Speech</h2>

  <textarea
    id="textInput"
    rows="6"
    placeholder="ਇੱਥੇ ਆਪਣਾ Punjabi text ਲਿਖੋ..."
  ></textarea>

  <label>Voice</label>

  <select id="voiceSelect">
    <option value="male-qn-qingse">KS My Voice</option>
    <option value="male-qn-jingying">Punjabi Voice</option>
    <option value="female-shaonv">Hindi Voice</option>
    <option value="English_expressive_narrator">English Voice</option>
  </select>

  <label>Language</label>

  <select id="languageSelect">
    <option value="Punjabi">Punjabi</option>
    <option value="Hindi">Hindi</option>
    <option value="English">English</option>
  </select>

  <button id="generateBtn" onclick="generateVoice()">
    🎤 Generate Voice
  </button>

  <div id="status" class="status"></div>

  <div id="result" class="result">
    <h3>✅ Voice Ready</h3>
    <audio id="audioPlayer" controls></audio>
  </div>
</div>

</div>

<br>

<!-- PRICING -->
<div class="card" id="pricing">
  <h2>💰 Pricing</h2>
  <p>AI Voice Generation • Punjabi • Hindi • English</p>
  <p>Voice Clone • Text to Speech</p>
</div>

</div>

<footer>
  © 2026 KS Voice AI
</footer>


<script>

async function generateVoice(){

  const text =
    document.getElementById("textInput").value.trim();

  const voiceId =
    document.getElementById("voiceSelect").value;

  const language =
    document.getElementById("languageSelect").value;

  const status =
    document.getElementById("status");

  const button =
    document.getElementById("generateBtn");

  const result =
    document.getElementById("result");

  const audio =
    document.getElementById("audioPlayer");


  if(!text){
    status.innerText = "⚠️ ਪਹਿਲਾਂ text ਲਿਖੋ।";
    return;
  }


  button.disabled = true;
  button.innerText = "⏳ Voice ਬਣ ਰਹੀ ਹੈ...";
  status.innerText = "MiniMax AI ਨਾਲ voice ਬਣਾਈ ਜਾ ਰਹੀ ਹੈ...";
  result.style.display = "none";


  try{

    const response = await fetch("/api/tts",{
      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({

        text:text,

        voiceId:voiceId,

        speed:1,

        volume:1,

        pitch:0,

        emotion:"calm",

        language:language

      })
    });


    if(!response.ok){

      let message = "Voice generation failed";

      try{
        const errorData = await response.json();

        if(errorData.error){
          message = errorData.error;
        }

      }catch(e){}

      throw new Error(message);
    }


    const blob = await response.blob();

    const audioUrl =
      URL.createObjectURL(blob);

    audio.src = audioUrl;

    audio.load();

    result.style.display = "block";

    status.innerText =
      "✅ Voice successfully ਬਣ ਗਈ ਹੈ।";

  }

  catch(error){

    console.error(error);

    status.innerText =
      "❌ Error: " + error.message;

  }

  finally{

    button.disabled = false;

    button.innerText =
      "🎤 Generate Voice";

  }

}


function cloneDemo(){

  const file =
    document.getElementById("voiceFile").files[0];

  const status =
    document.getElementById("cloneStatus");


  if(!file){

    status.innerText =
      "⚠️ ਪਹਿਲਾਂ voice recording upload ਕਰੋ।";

    return;
  }


  status.innerText =
    "📁 Voice file ਮਿਲ ਗਈ ਹੈ। Voice Clone API ਅਗਲੇ ਕਦਮ ਵਿੱਚ connect ਕਰਾਂਗੇ।";
}

</script>

</body>   
  </html>
